services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: staffic
      POSTGRES_PASSWORD: staffic
      POSTGRES_DB: staffic
    ports:
      - "5432:5432"
    volumes:
      - staffic_postgres_data:/var/lib/postgresql/data

volumes:
  staffic_postgres_data:
